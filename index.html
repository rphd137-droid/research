<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionnaire</title>
<style>
:root { --primary:#1f4e8c; --bg:#f5f6f8; --card:#fff; --ink:#1d2433; --muted:#5b6475; --line:#dfe3ea; --soft:#e8eef8; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --size:16px; --radius:12px; --err:#b3261e; }
* { box-sizing:border-box; }
body { margin:0; font-family:var(--font); font-size:var(--size); color:var(--ink); background:var(--bg); line-height:1.55; }
.wrap { max-width:860px; margin:0 auto; padding:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
header.card { border-top:6px solid var(--primary); }
h1 { font-size:1.35em; margin:0 0 10px; text-align:center; line-height:1.3; }
h2 { font-size:1.08em; margin:0 0 6px; color:var(--primary); }
h3 { font-size:.95em; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.03em; }
p { margin:.5em 0; }
.muted { color:var(--muted); font-size:.92em; }
.progress { position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0; }
.bar { height:6px; background:var(--line); border-radius:99px; overflow:hidden; }
.bar i { display:block; height:100%; width:0; background:var(--primary); transition:width .2s; }
.bar-label { font-size:.75em; color:var(--muted); margin-top:4px; text-align:right; }
fieldset { border:0; margin:0; padding:0; min-width:0; }
.q { padding:14px 0; border-bottom:1px solid var(--line); }
.q:last-child { border-bottom:0; }
legend, .qlabel { font-weight:600; padding:0; margin-bottom:8px; display:block; }
.n { color:var(--primary); }
.req { color:var(--err); }
.help { color:var(--muted); font-size:.88em; margin:-4px 0 8px; font-weight:400; }
.opts { display:flex; flex-wrap:wrap; gap:8px; }
.opt { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:calc(var(--radius) * .7); padding:8px 12px; cursor:pointer; background:var(--card); }
.opt:has(input:checked) { border-color:var(--primary); background:var(--soft); }
.opt input { accent-color:var(--primary); margin:0; }
input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], select, textarea {
  width:100%; padding:10px; border:1px solid var(--line); border-radius:calc(var(--radius) * .7); font:inherit; background:var(--card); color:var(--ink); }
input.other { display:none; margin-top:8px; }
input.other.show { display:block; }
.scale-key { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.82em; color:var(--muted); background:var(--soft); padding:8px 12px; border-radius:calc(var(--radius) * .7); margin:6px 0; }
.lrow { padding:12px 0; border-bottom:1px solid var(--line); }
.lrow legend { font-weight:500; }
.scale { display:grid; gap:6px; }
.lk { display:flex; flex-direction:column; align-items:center; gap:2px; border:1px solid var(--line); border-radius:calc(var(--radius) * .7); padding:8px 4px; cursor:pointer; text-align:center; position:relative; }
.lk input { position:absolute; opacity:0; pointer-events:none; }
.lk .v { font-weight:700; }
.lk .t { font-size:.68em; color:var(--muted); line-height:1.2; }
.lk:has(input:checked) { background:var(--primary); border-color:var(--primary); }
.lk:has(input:checked) .v, .lk:has(input:checked) .t { color:#fff; }
.lk:has(input:focus-visible) { outline:3px solid var(--soft); }
.field { margin:10px 0; }
.field label { display:block; font-weight:600; margin-bottom:4px; }
.consent { display:flex; gap:10px; align-items:flex-start; }
.consent input { margin-top:5px; accent-color:var(--primary); width:18px; height:18px; flex:none; }
.missing { background:rgba(179,38,30,.08); border-radius:8px; padding-left:8px; padding-right:8px; }
button { width:100%; padding:14px; font:inherit; font-weight:700; color:#fff; background:var(--primary); border:0; border-radius:var(--radius); cursor:pointer; }
button:disabled { opacity:.6; cursor:wait; }
#msg { margin-top:10px; color:var(--err); font-weight:600; text-align:center; }
.center { text-align:center; padding:40px 20px; }
.banner { background:#fff4ce; color:#5c4400; border:1px solid #f0d77a; padding:10px 14px; border-radius:8px; margin-bottom:12px; font-size:.9em; }
.list a { display:block; padding:14px; border:1px solid var(--line); border-radius:var(--radius); margin:8px 0; color:var(--primary); text-decoration:none; font-weight:600; background:var(--card); }
@media (max-width:520px) { .lk .t { display:none; } .wrap { padding:10px; } .card { padding:16px; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card center muted">Loading…</div></div>
<script src="common.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var slug = (params.get('s') || '').toLowerCase();
  var preview = params.get('preview') === '1';

  function show(html) { app.innerHTML = html; }
  function message(title, text) { show('<div class="card center"><h2>' + esc(title) + '</h2>' + paras(text) + '</div>'); }

  async function start() {
    try {
      if (!slug) {
        var list = (await SB.rest('GET', 'surveys?select=slug,title&status=eq.published&order=updated_at.desc', undefined, { anon: true })).data || [];
        if (list.length === 1) { slug = list[0].slug; }
        else if (!list.length) return message('No questionnaire is open', 'Please check the link you were given.');
        else return show('<div class="card"><h2>Open questionnaires</h2><div class="list">' + list.map(function (s) {
          return '<a href="?s=' + encodeURIComponent(s.slug) + '">' + esc(s.title) + '</a>';
        }).join('') + '</div></div>');
      }
      var res = await SB.rest('GET', 'surveys?select=*&slug=eq.' + encodeURIComponent(slug), undefined, { anon: !preview });
      var survey = (res.data || [])[0];
      if (!survey) return message('Questionnaire not found', 'Please check the link you were given.');
      render(survey);
    } catch (e) {
      message('Could not load the questionnaire', 'Please check your internet connection and try again. (' + e.message + ')');
    }
  }

  function render(survey) {
    var S = fullSettings(survey.settings), Q = survey.questions || { sections: [] };
    applyTheme(document.documentElement, S.theme);
    document.title = survey.title;
    var open = survey.status === 'published' && (!survey.close_at || new Date(survey.close_at) > new Date());
    if (!open && !preview) return message(survey.title, S.texts.closedMessage);
    var doneKey = 'rq_done_' + survey.id;
    if (!preview && S.rules.oneResponsePerDevice) {
      try { if (localStorage.getItem(doneKey)) return message(survey.title, 'You have already submitted this questionnaire. Thank you!'); } catch (e) {}
    }
    var nums = numbering(Q, S.rules.numberQuestions);
    function num(code) { return nums[code] ? '<span class="n">' + nums[code] + '.</span> ' : ''; }
    function star(q) { return q.required ? ' <span class="req">*</span>' : ''; }
    function help(q) { return q.help ? '<div class="help">' + esc(q.help) + '</div>' : ''; }

    var h = [];
    if (preview) h.push('<div class="banner"><b>Preview</b> – this is how respondents will see it. Answers are not saved in preview' + (survey.status !== 'published' ? ' (status: ' + esc(survey.status) + ')' : '') + '.</div>');
    h.push('<header class="card"><h1>' + esc(survey.title) + '</h1>' + paras(S.texts.intro) +
      '<p class="muted">Questions marked <span class="req">*</span> are required.</p></header>');
    if (S.rules.showProgress) h.push('<div class="progress"><div class="bar"><i id="barFill"></i></div><div class="bar-label" id="barLabel">0% complete</div></div>');
    h.push('<form id="f" novalidate><input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">');

    var fields = RESPONDENT_FIELDS.filter(function (f) { return S.respondent.mode === 'details' && S.respondent.fields[f.key].on; });
    if (fields.length) {
      h.push('<section class="card"><h2>' + esc(S.respondent.heading || 'Your details') + '</h2>');
      fields.forEach(function (f) {
        var req = S.respondent.fields[f.key].required;
        var input = f.type === 'textarea'
          ? '<textarea rows="3" data-resp="' + f.key + '"' + (req ? ' data-req="1"' : '') + ' maxlength="500"></textarea>'
          : '<input type="' + f.type + '" data-resp="' + f.key + '"' + (req ? ' data-req="1"' : '') + ' maxlength="200"' + (f.type === 'tel' ? ' inputmode="tel"' : '') + '>';
        h.push('<div class="field" data-block="resp_' + f.key + '"><label>' + esc(f.label) + (req ? ' <span class="req">*</span>' : '') + '</label>' + input + '</div>');
      });
      h.push('</section>');
    }

    (Q.sections || []).forEach(function (sec) {
      h.push('<section class="card">' + (sec.title ? '<h2>' + esc(sec.title) + '</h2>' : '') + (sec.description ? '<div class="muted">' + paras(sec.description) + '</div>' : ''));
      (sec.items || []).forEach(function (q) {
        var c = esc(q.code);
        if (q.type === 'single' || q.type === 'multi') {
          var type = q.type === 'single' ? 'radio' : 'checkbox';
          h.push('<fieldset class="q" data-block="' + c + '" data-type="' + q.type + '"' + (q.required ? ' data-req="1"' : '') + '><legend>' + num(q.code) + esc(q.text) + (q.type === 'multi' ? ' <span class="muted">(you may select more than one)</span>' : '') + star(q) + '</legend>' + help(q) + '<div class="opts">');
          choiceOptions(q).forEach(function (o) {
            h.push('<label class="opt"><input type="' + type + '" name="' + c + '" value="' + esc(o) + '"><span>' + esc(o) + '</span></label>');
          });
          h.push('</div>' + (q.other ? '<input class="other" type="text" maxlength="200" placeholder="If Other, please specify" data-other="' + c + '">' : '') + '</fieldset>');
        } else if (q.type === 'dropdown') {
          h.push('<div class="q" data-block="' + c + '" data-type="dropdown"' + (q.required ? ' data-req="1"' : '') + '><label class="qlabel">' + num(q.code) + esc(q.text) + star(q) + '</label>' + help(q) +
            '<select name="' + c + '"><option value="">– Select –</option>' + choiceOptions(q).map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>' +
            (q.other ? '<input class="other" type="text" maxlength="200" placeholder="If Other, please specify" data-other="' + c + '">' : '') + '</div>');
        } else if (q.type === 'likert') {
          var sc = scaleOf(q);
          h.push('<div class="q" data-type="likert-group">' + (q.text ? '<h3>' + esc(q.text) + '</h3>' : '') + help(q) +
            '<div class="scale-key">' + sc.map(function (x) { return '<span>' + x.value + ' = ' + esc(x.label) + '</span>'; }).join('') + '</div>');
          (q.statements || []).forEach(function (st) {
            var sc2 = esc(st.code);
            h.push('<fieldset class="lrow" data-block="' + sc2 + '" data-type="likert"' + (q.required ? ' data-req="1"' : '') + '><legend>' + num(st.code) + esc(st.text) + star(q) + '</legend>' +
              '<div class="scale" style="grid-template-columns:repeat(' + sc.length + ',1fr)">' + sc.map(function (x) {
                return '<label class="lk"><input type="radio" name="' + sc2 + '" value="' + x.value + '"><span class="v">' + x.value + '</span><span class="t">' + esc(x.label) + '</span></label>';
              }).join('') + '</div></fieldset>');
          });
          h.push('</div>');
        } else {
          var inp = q.type === 'long' ? '<textarea rows="4" name="' + c + '" maxlength="5000"></textarea>'
            : '<input type="' + (q.type === 'number' ? 'number' : q.type === 'date' ? 'date' : 'text') + '" name="' + c + '"' + (q.type === 'number' ? ' step="any" inputmode="decimal"' : ' maxlength="500"') + '>';
          h.push('<div class="q" data-block="' + c + '" data-type="' + q.type + '"' + (q.required ? ' data-req="1"' : '') + '><label class="qlabel">' + num(q.code) + esc(q.text) + star(q) + '</label>' + help(q) + inp + '</div>');
        }
      });
      h.push('</section>');
    });

    if (S.consent.on) h.push('<section class="card"><label class="consent" data-block="_consent"><input type="checkbox" id="consentBox"><span>' + esc(S.consent.text) + ' <span class="req">*</span></span></label></section>');
    h.push('<div class="card"><button type="submit" id="btn">' + esc(S.texts.submitLabel || 'Submit') + '</button><div id="msg" role="alert"></div></div></form>');
    show(h.join(''));
    wire(survey, S, doneKey);
  }

  function wire(survey, S, doneKey) {
    var form = document.getElementById('f');
    var blocks = Array.from(form.querySelectorAll('[data-block]'));

    function valueOf(b) {
      var t = b.dataset.type, name = b.dataset.block;
      if (t === 'multi') return Array.from(b.querySelectorAll('input[type=checkbox]:checked')).map(function (i) { return i.value; });
      if (t === 'single' || t === 'likert') { var r = b.querySelector('input[type=radio]:checked'); return r ? r.value : ''; }
      if (name === '_consent') return document.getElementById('consentBox').checked ? 'yes' : '';
      var el = b.querySelector('select, textarea, input:not(.other)');
      return el ? el.value.trim() : '';
    }
    function filled(b) { var v = valueOf(b); return Array.isArray(v) ? v.length > 0 : v !== ''; }

    // "Other – please specify"
    form.querySelectorAll('input.other').forEach(function (box) {
      var b = box.closest('[data-block]');
      function sync() {
        var v = valueOf(b), on = Array.isArray(v) ? v.indexOf('Other') >= 0 : v === 'Other';
        box.classList.toggle('show', on); if (!on) box.value = '';
      }
      b.addEventListener('change', sync); sync();
    });

    var required = blocks.filter(function (b) { return b.dataset.req || b.dataset.block === '_consent'; });
    function updateBar() {
      var fill = document.getElementById('barFill'); if (!fill) return;
      var pct = required.length ? Math.round(required.filter(filled).length / required.length * 100) : 100;
      fill.style.width = pct + '%'; document.getElementById('barLabel').textContent = pct + '% complete';
    }
    form.addEventListener('input', updateBar); form.addEventListener('change', updateBar); updateBar();

    form.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var msg = document.getElementById('msg'), btn = document.getElementById('btn');
      form.querySelectorAll('.missing').forEach(function (el) { el.classList.remove('missing'); });
      var bad = null;
      blocks.forEach(function (b) {
        var need = b.dataset.req || b.dataset.block === '_consent';
        var problem = need && !filled(b);
        var other = b.querySelector('input.other.show');
        if (other && !other.value.trim()) problem = true;
        if (b.dataset.resp === undefined && b.querySelector('input[type=email]')) {
          var em = b.querySelector('input[type=email]').value.trim();
          if (em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) problem = true;
        }
        if (problem) { b.classList.add('missing'); bad = bad || b; }
      });
      form.querySelectorAll('[data-resp]').forEach(function (inp) {
        var b = inp.closest('[data-block]');
        if (inp.dataset.req && !inp.value.trim()) { b.classList.add('missing'); bad = bad || b; }
      });
      if (bad) { msg.textContent = 'Please complete the highlighted questions.'; bad.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      msg.textContent = '';
      if (form.website.value) return;

      var answers = {}, respondent = null;
      blocks.forEach(function (b) {
        var name = b.dataset.block; if (name === '_consent' || /^resp_/.test(name)) return;
        var v = valueOf(b);
        if (Array.isArray(v) ? v.length : v !== '') answers[name] = b.dataset.type === 'likert' || b.dataset.type === 'number' ? Number(v) : v;
        var other = b.querySelector('input.other.show');
        if (other && other.value.trim()) answers[name + '__other'] = other.value.trim();
      });
      form.querySelectorAll('[data-resp]').forEach(function (inp) {
        if (inp.value.trim()) { respondent = respondent || {}; respondent[inp.dataset.resp] = inp.value.trim(); }
      });
      if (S.consent.on) { respondent = respondent || {}; respondent._consent = true; }

      if (preview) { msg.style.color = 'var(--primary)'; msg.textContent = 'Preview: everything is filled in correctly. (Nothing was saved.)'; return; }
      btn.disabled = true; btn.textContent = 'Submitting…';
      try {
        await SB.rest('POST', 'submissions', { survey_id: survey.id, respondent: respondent, answers: answers }, { anon: true, prefer: 'return=minimal' });
        try { localStorage.setItem(doneKey, '1'); } catch (e) {}
        message(survey.title, S.texts.thankYou);
        window.scrollTo(0, 0);
      } catch (e) {
        if (e.code === '42501' || e.status === 401 || e.status === 403) {
          message(survey.title, S.texts.closedMessage);
        } else {
          msg.textContent = 'Sorry, your response could not be saved (' + e.message + '). Please try again.';
          btn.disabled = false; btn.textContent = S.texts.submitLabel || 'Submit';
        }
      }
    });
  }

  start();
})();
</script>
</body>
</html>
